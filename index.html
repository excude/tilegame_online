function showRoundResultModal(roundScores, counts, winnerIdx, transfers, isLastRound){
  if(transfers===undefined){
    // 저장된 게임을 불러와 복원하는 경우를 대비한 안전장치
    transfers = computeTransfers(counts);
  }
  if(isLastRound===undefined){
    isLastRound = matchState.endMode==='bust' ? matchState.scores.some(s=>s<=0) : matchState.round>=matchState.totalRounds;
  }
  const rows = G.players.map((p,i)=>{
    const delta=roundScores[i];
    const twoCount = (p.hand||[]).filter(t=>t.num===2).length;
    const penaltyHint = (i!==winnerIdx && twoCount>0) ? ` · <span style="color:#ef9d7d;">2 페널티 ×${Math.pow(2,twoCount)}</span>` : '';
    return `
    <div class="score-row"><span>${p.name} ${i===winnerIdx?'(승리)':`· 남은 ${counts[i]}장${penaltyHint}`}</span>
    <span class="val ${delta>=0?'pos':'neg'}">${delta>=0?'+':''}${delta}<span class="cur">(${matchState.scores[i]}점)</span></span></div>`;
  }).join('');
  const settleRows = transfers.map(t=>`
    <div class="settle-row"><span>${G.players[t.from].name} → ${G.players[t.to].name}</span><span class="amt">-${t.amount}</span></div>`).join('');
  const bustHint = matchState.endMode==='bust' && isLastRound
    ? `<p class="sub" style="text-align:center;color:#ef9d7d;">0점 이하가 된 플레이어가 있어 매치가 종료됩니다.</p>` : '';
  // 온라인 모드에서는 다음 라운드로 넘기는 건 host만 할 수 있고, 게스트는 "확인"만 눌러
  // 자기 화면에서 레벨/경험치 정산을 보고 host의 다음 라운드 시작을 기다린다.
  const canAdvance = !onlineEnabled() || online.host;
  openModal(`<h2>${matchState.round}라운드 결과</h2>
    ${rows}
    <div class="settle-title">정산 내역</div>
    <div class="settle-list">${settleRows || '<div class="settle-row">정산할 내역이 없습니다.</div>'}</div>
    ${bustHint}
    <div class="modal-actions">
      <button class="btn ghost" id="roundLogBtn">📜 로그</button>
      ${canAdvance
        ? `<button class="btn" id="roundNextBtn">${isLastRound?'최종 결과 보기':'다음 라운드'}</button>`
        : `<button class="btn" id="roundAckBtn">확인</button>`}
    </div>`);
  const nextBtn=document.getElementById('roundNextBtn');
  if(nextBtn) nextBtn.onclick=()=>{
    showRoundXpModal(()=>{
      if(isLastRound){ showFinalResultModal(); }
      else { closeModal(); matchState.round++; startRound(); }
    });
  };
  const ackBtn=document.getElementById('roundAckBtn');
  if(ackBtn) ackBtn.onclick=()=>{ showRoundXpModal(()=>{ closeModal(); }); };
  document.getElementById('roundLogBtn').onclick=()=>{
    openLogModal(()=>showRoundResultModal(roundScores, counts, winnerIdx, transfers, isLastRound));
  };
}
// 마이티 온라인처럼, 라운드가 끝날 때마다 그 라운드 성적으로 레벨/경험치를 정산해서 보여준다.
function showRoundXpModal(onDone){
  const histEntry = matchState.history[matchState.history.length-1];
  let r = histEntry.xpResult;
  if(!histEntry.xpApplied){
    r = applyRoundResultToProfile(histEntry.roundScores);
    histEntry.xpApplied = true;
    histEntry.xpResult = r;
    queueSave();
  }
  const startLevel=r.startLevel, startXp=r.startXp;
  const endLevel=profile.level, endXp=profile.xp;
  const leveledUp = r.levelUps && r.levelUps.length>0;
  const leveledDown = r.levelDowns && r.levelDowns.length>0;
  if(leveledUp) setTimeout(()=>sfxPlay('levelup'), 850); // 레벨업 배너가 뜨는 타이밍(0.35s 지연 애니메이션)에 맞춰 재생
  if(leveledDown) setTimeout(()=>sfxPlay('lose'), 850);
  const startPct = levelProgressPercent(startLevel, startXp);
  const finalPct = levelProgressPercent(endLevel, endXp);

  const breakdownHtml = r.breakdown.map((b,i)=>
    `<div class="xpRow" style="animation-delay:${0.5+i*0.12}s"><span>${b.label}</span><span class="amt" style="${b.amount<0?'color:#ef9d7d;':''}">${b.amount>=0?'+':''}${b.amount}</span></div>`
  ).join('');

  const confettiEmojis=['🎉','✨','🎊','⭐','💫'];
  const confettiHtml = leveledUp ? Array.from({length:14}).map((_,i)=>{
    const left=Math.round(Math.random()*100);
    const delay=(Math.random()*0.4).toFixed(2);
    const emoji=confettiEmojis[i%confettiEmojis.length];
    return `<span class="confetti" style="left:${left}%;animation-delay:${delay}s;">${emoji}</span>`;
  }).join('') : '';

  openModal(`
    <div class="xpModal">
      <h2 style="text-align:center;">${r.xpGain>=0?'경험치 획득!':'경험치 감소'}</h2>
      ${leveledUp?`<div class="confettiWrap">${confettiHtml}</div>`:''}
      <div class="xpGainText" style="${r.xpGain<0?'color:#ef9d7d;':''}">${r.xpGain>=0?'+':''}${r.xpGain} XP</div>
      ${r.streak>=2?`<div class="xpStreak">🔥 ${r.streak}라운드 연승 중!</div>`:''}
      ${leveledUp?`<div class="levelUpBanner">🎉 LEVEL UP! Lv.${startLevel} → Lv.${endLevel} 🎉</div>`:''}
      ${leveledDown?`<div class="levelUpBanner" style="background:linear-gradient(90deg,#c97a7a,#e8a8a8,#c97a7a);color:#3a0a0a;">📉 LEVEL DOWN. Lv.${startLevel} → Lv.${endLevel}</div>`:''}
      <div class="xpLevelRow">
        <div class="xpLevelBadge" id="xpLevelBadge">
          <div class="lv-num" id="xpLevelNum">${startLevel}</div>
          <div class="lv-label">LEVEL</div>
        </div>
        <div class="xpBarWrap">
          <div class="xpBarLabel"><span id="xpBarLabelText">${Math.round(startXp)} / ${xpToNextLevel(startLevel)} XP</span><span>Lv.${startLevel===endLevel?endLevel:(startLevel+' → '+endLevel)}</span></div>
          <div class="xpBarTrack"><div class="xpBarFill" id="xpBarFill" style="width:${startPct}%"></div></div>
        </div>
      </div>
      <div class="xpBreakdown">${breakdownHtml}</div>
      <p class="sub" style="text-align:center;">누적 ${profile.totalRoundWins||0}승 / ${profile.totalRounds||0}라운드 · 최고 연승 ${profile.bestStreak}회</p>
      <div class="modal-actions"><button class="btn" id="xpContinueBtn">계속하기</button></div>
    </div>
  `);

  const fill=document.getElementById('xpBarFill');
  const badge=document.getElementById('xpLevelBadge');
  const lvNum=document.getElementById('xpLevelNum');
  const labelText=document.getElementById('xpBarLabelText');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(!leveledUp){
        if(fill) fill.style.width=finalPct+'%';
        if(labelText) labelText.textContent=`${Math.round(endXp)} / ${xpToNextLevel(endLevel)} XP`;
      } else {
        if(fill) fill.style.width='100%';
        setTimeout(()=>{
          if(badge) badge.classList.add('leveling');
          if(lvNum) lvNum.textContent=endLevel;
          if(fill){ fill.style.transition='none'; fill.style.width='0%'; }
          setTimeout(()=>{
            if(fill){ fill.style.transition='width 0.9s cubic-bezier(.2,.8,.3,1)'; fill.style.width=finalPct+'%'; }
            if(labelText) labelText.textContent=`${Math.round(endXp)} / ${xpToNextLevel(endLevel)} XP`;
          },60);
        },950);
      }
    });
  });

  document.getElementById('xpContinueBtn').onclick=()=>{ closeModal(); onDone(); };
}
function showFinalResultModal(){
  if(!matchState.matchOver){ matchState.matchOver=true; }
  if(!matchState.finalApplied){
    applyMatchResultToProfile();
    matchState.finalApplied=true;
    queueSave();
    const order0=[0,1,2,3].slice().sort((a,b)=>matchState.scores[b]-matchState.scores[a]);
    sfxPlay(order0.indexOf(meId())===0 ? 'win' : 'lose');
  }
  const order=[0,1,2,3].slice().sort((a,b)=>matchState.scores[b]-matchState.scores[a]);
  const medals=['🥇','🥈','🥉','4위'];
  const rows=order.map((idx,rank)=>`
    <div class="rank-row"><span class="medal">${medals[rank]}</span>
    <span style="flex:1;">${G.players[idx].name}</span>
    <span class="val">${matchState.scores[idx]}점</span></div>`).join('');

  openModal(`<h2>최종 결과</h2>${rows}
    <p class="sub" style="text-align:center;margin-top:10px;">경험치는 라운드마다 정산되었습니다 · 현재 Lv.${profile.level}</p>
    <div class="modal-actions">
      <button class="btn ghost" id="finalLogBtn">📜 로그</button>
      <button class="btn" id="finalNewBtn">${onlineEnabled()?'방 나가기':'새 매치 시작'}</button>
    </div>`);
  document.getElementById('finalNewBtn').onclick=async ()=>{ onlineDisconnect(); await clearSavedGame(); showSetupModal(); };
  document.getElementById('finalLogBtn').onclick=()=>{ openLogModal(()=>showFinalResultModal()); };
}
const RULE_TEXT = `
    4인 고정 (나 + 영호·옥순·순자) · 각자 13장씩 시작합니다.<br><br>
    · 순서: 싱글(1) &lt; 페어(2) &lt; 트리플(3) &lt; 메이드(5). 4장은 낼 수 없습니다.<br>
    · 숫자 순위: 2 &gt; 1 &gt; 13 &gt; 12 &gt; … &gt; 3<br>
    · 같은 숫자는 해 &gt; 달 &gt; 별 &gt; 구름 순<br>
    · 메이드(5장): 스트레이트플러시 &gt; 포카드 &gt; 풀하우스 &gt; 플러시 &gt; 스트레이트<br>
    · 구름3을 가진 사람이 첫 선(先)이 됩니다.<br>
    · 모두 패스하면 마지막으로 낸 사람이 다시 선이 됩니다.<br>
    · 한 명이 타일을 다 내면 그 라운드는 즉시 종료, 남은 타일 수 차이만큼 정산합니다.<br>
    · 2 페널티: 라운드가 끝날 때 손에 숫자 2가 남아있으면, 2가 1장당 벌점이 2배씩 중첩됩니다
    (2장이면 4배, 3장이면 8배, 4장이면 16배). 예: 3장 중 2장이 숫자 2라면 3장×4배=12장으로 간주해 정산합니다.<br>
    · 라운드제: 정해진 판 수를 모두 마치면 총점이 가장 높은 사람이 우승입니다.<br>
    · 점수제: 시작 점수에서 매 라운드 정산하며, 누구든 0점 이하가 되면 매치가 종료됩니다.
`;
function showRulesModal(){
  openModal(`<h2>렉시오 · LEXIO 규칙</h2>
    <p class="sub">${RULE_TEXT}</p>
    <div class="modal-actions"><button class="btn" id="closeRuleBtn">닫기</button></div>`);
  document.getElementById('closeRuleBtn').onclick=closeModal;
}

const ROUND_PRESETS=[3,5,7,10];
let setupEndMode='rounds';
let setupTotalRounds=TOTAL_ROUNDS;
function showSetupModal(){
  setupEndMode='rounds';
  setupTotalRounds=TOTAL_ROUNDS;
  renderSetupModal();
}
function renderSetupModal(){
  openModal(`<h2>렉시오 · LEXIO</h2>
    <p class="sub" style="text-align:center;">4인 고정 (나 + 영호·옥순·순자) · 각자 13장씩 시작합니다.</p>
    <p class="sub">진행 방식</p>
    <div class="row" id="endModeRow">
      <div class="suit-opt${setupEndMode==='rounds'?' sel':''}" data-mode="rounds">📅 라운드제</div>
      <div class="suit-opt${setupEndMode==='bust'?' sel':''}" data-mode="bust">💯 점수제</div>
    </div>
    <div id="roundCountSection" style="display:${setupEndMode==='rounds'?'':'none'};">
      <p class="sub">총 라운드 수</p>
      <div class="row" id="roundPresetRow">
        ${ROUND_PRESETS.map(n=>`<div class="suit-opt${n===setupTotalRounds?' sel':''}" data-n="${n}">${n}판</div>`).join('')}
      </div>
    </div>
    <div id="startScoreSection" style="display:${setupEndMode==='bust'?'':'none'};">
      <p class="sub">시작 점수 (보통 50점)</p>
      <div class="row"><input type="number" id="startScoreInput" value="50" min="10" max="999"
        style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0000002a;color:var(--ivory);font-size:14px;"></div>
      <p class="sub">누구든 점수가 0점 이하가 되면 그 라운드를 끝으로 매치가 종료됩니다.</p>
    </div>
    <div class="modal-actions"><button class="btn" id="setupStartBtn">게임 시작</button></div>
    <div class="modal-actions" style="margin-top:6px;"><button class="btn ghost" id="setupOnlineBtn">🌐 온라인으로 함께하기</button></div>`);

  document.querySelectorAll('#endModeRow .suit-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ setupEndMode=el.dataset.mode; renderSetupModal(); });
  });
  document.querySelectorAll('#roundPresetRow .suit-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ setupTotalRounds=parseInt(el.dataset.n,10); renderSetupModal(); });
  });
  document.getElementById('setupStartBtn').onclick=()=>{
    if(setupEndMode==='bust'){
      const v=parseInt(document.getElementById('startScoreInput').value,10);
      const startScore=isNaN(v)?50:Math.max(10,Math.min(999,v));
      startMatch({endMode:'bust', startScore});
    } else {
      startMatch({endMode:'rounds', totalRounds:setupTotalRounds});
    }
  };
  document.getElementById('setupOnlineBtn').onclick=()=>{ showOnlineEntry(); };
}

/* ============================ 저장/불러오기 ============================ */
let saveTimer=null;
function queueSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(saveGameState, 300); }
async function saveGameState(){
  if(!G || onlineEnabled()) return; // 온라인 대전 상태는 로컬에 저장하지 않는다(각자 방에 다시 접속해서 이어감)
  try{ localStorage.setItem('lexio_save', JSON.stringify({G, matchState})); }catch(e){}
}
function flushSaveNow(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; } saveGameState(); }
async function clearSavedGame(){ try{ localStorage.removeItem('lexio_save'); }catch(e){} }

document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSaveNow(); });
window.addEventListener('pagehide', flushSaveNow);
window.addEventListener('beforeunload', flushSaveNow);
window.addEventListener('blur', flushSaveNow);

/* ============================ 초기화 ============================ */
(async function init(){
  wakeOnlineServer(); // 페이지 진입 즉시 Render 서버 깨우기 시작 (마이티와 동일한 방식)
  const chatBtn = document.getElementById('chatBubbleBtn');
  if(chatBtn) chatBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openChatModal(); });
  updateChatButtonVisibility();
  loadSfxPref();
  await loadProfile();
  try{
    const raw=localStorage.getItem('lexio_save');
    if(raw){
      const data=JSON.parse(raw);
      if(data && data.G && data.matchState){
        matchState=data.matchState;
        G=data.G;
        if(!matchState.endMode) matchState.endMode='rounds';
        // JSON은 Infinity를 저장할 수 없어 null로 바뀌므로 점수제 매치는 불러올 때 다시 채워준다
        if(matchState.endMode==='bust') matchState.totalRounds=Infinity;
        else if(matchState.totalRounds===null || matchState.totalRounds===undefined) matchState.totalRounds=TOTAL_ROUNDS;
        render();
        if(G.finished){
          // 마지막으로 종료된 시점(라운드 결과 / 최종 결과)을 그대로 다시 보여준다
          if(matchState.matchOver){ showFinalResultModal(); }
          else{
            const last=matchState.history[matchState.history.length-1];
            if(last) showRoundResultModal(last.roundScores, last.counts, last.winnerIdx, last.transfers, last.isLastRound);
          }
        } else {
          scheduleTurnIfAI();
        }
        return;
      }
    }
  }catch(e){}
  showSetupModal();
})();

})();
</script>
</body>
</html>
