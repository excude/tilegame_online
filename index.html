<!-- LEXIO (렉시오) - Online Solo v0.016 (4인 고정: 나 + AI 3) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
<title>렉시오 · LEXIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-1:#221430;
    --wood-2:#4a2d66;
    --ivory:#f5ecd7;
    --ivory-2:#efe2c2;
    --gold:#c99a4a;
    --gold-bright:#e8c27a;
    --ink:#1c1226;
    --panel:#2a1c3ecc;
    --line:#8a6ab0;
    --sun:#d9682f;
    --moon:#3b6ea5;
    --star:#8a5cc4;
    --cloud:#3e8574;
    --sun-bg1:#ffe3e2;  --sun-bg2:#ffc6c4;
    --moon-bg1:#ddf7e3; --moon-bg2:#bdeecb;
    --star-bg1:#fff7d1; --star-bg2:#ffecA0;
    --cloud-bg1:#dcebff; --cloud-bg2:#b9d6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100% !important;text-size-adjust:100% !important;}
  html,body{height:100%;margin:0;font-size:16px;}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:radial-gradient(ellipse at 50% 15%, var(--wood-2), var(--wood-1) 75%);
    color:var(--ivory);
    overflow:hidden;
    height:100dvh;width:100vw;position:fixed;inset:0;
  }
  .title-font{font-family:'Black Han Sans',sans-serif;letter-spacing:2px;}

  #app{position:relative;width:100%;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;box-shadow:0 0 40px #00000080;}

  /* topbar */
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,#170e20,transparent);z-index:20;gap:8px;}
  #topbar .brand{font-size:20px;color:var(--gold-bright);}
  #topbar .brand .ver-tag{display:inline-block;color:#3a2a0a;background:var(--gold-bright);font-size:10px;font-family:'Noto Sans KR';font-weight:700;vertical-align:middle;margin-left:6px;padding:2px 6px;border-radius:8px;letter-spacing:0;}
  #topbar .brand span{color:var(--ivory);font-size:11px;display:block;font-family:'Noto Sans KR';opacity:.65;margin-top:-2px;}
  #roundTag{font-size:11px;padding:5px 10px;border:1px solid var(--gold);border-radius:20px;color:var(--gold-bright);background:#00000030;white-space:nowrap;}
  #newGameBtn{background:none;border:1px solid var(--line);color:var(--ivory);border-radius:20px;padding:5px 10px;font-size:11px;cursor:pointer;}
  #newGameBtn:active{background:#00000040;}

  #statusStrip{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px;z-index:20;}
  .status-badge{font-size:11px;padding:5px 10px;border-radius:20px;background:#00000045;border:1px solid #c99a4a55;color:var(--ivory);white-space:nowrap;}
  .status-badge.me{color:var(--gold-bright);border-color:var(--gold);font-weight:700;}
  .status-badge.leader{color:#8ee0c8;border-color:#3e857488;}
  .status-badge.turn{color:#f0cd8a;border-color:var(--gold-bright);font-weight:800;}

  /* table */
  #table{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:22px;
    background:radial-gradient(ellipse at 50% 35%, #6d4a92 0%, #402a5c 55%, #201333 100%);
    border:6px solid #170e20;box-shadow:inset 0 0 60px #00000080, 0 10px 30px #00000060;overflow:hidden;}
  #table::before{content:"";position:absolute;inset:14px;border:1px solid #e8c27a33;border-radius:16px;pointer-events:none;}

  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;width:98px;transform:translate(-50%,-50%);}
  .seat .avatar{width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 35% 30%, #6d4a92,#201333);
    border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--gold-bright);font-family:'Black Han Sans';position:relative;}
  .seat.turn .avatar{border-color:var(--gold-bright);box-shadow:0 0 0 4px #e8c27a33, 0 0 14px #e8c27a88;}
  .seat .name{font-size:11px;color:var(--ivory);opacity:.9;white-space:nowrap;}
  .seat .name .seatScore{opacity:.8;font-weight:700;}
  .seat .name .seatScore.pos{color:#8ee0a8;}
  .seat .name .seatScore.neg{color:#ef9d7d;}
  .seat .cardcount{font-size:9px;opacity:.6;}
  .leader-badge{position:absolute;top:-6px;right:-6px;background:var(--gold-bright);color:#3a2a0a;font-size:9px;font-weight:900;border-radius:8px;padding:1px 5px;white-space:nowrap;}

  #centerArea{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:260px;}
  #lastComboLabel{font-size:11px;color:var(--gold-bright);opacity:.9;min-height:14px;text-align:center;}
  #lastComboTiles{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:52px;}
  #turnFlash{font-size:12px;color:var(--gold-bright);background:#00000060;padding:4px 10px;border-radius:10px;}

  .tile{width:38px;height:52px;border-radius:6px;background:linear-gradient(160deg,#fffdf6,#e9dfc4);
    box-shadow:0 2px 4px #00000060, inset 0 0 0 1px #00000015;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;flex-shrink:0;}
  .tile .num{font-family:'Black Han Sans';font-size:17px;line-height:1;}
  .tile .suit{font-size:10px;position:absolute;bottom:3px;right:4px;}
  .tile.sun .num{color:var(--sun);}
  .tile.moon .num{color:var(--moon);}
  .tile.star .num{color:var(--star);}
  .tile.cloud .num{color:var(--cloud);}
  .tile.sun{background:linear-gradient(160deg,var(--sun-bg1),var(--sun-bg2));}
  .tile.moon{background:linear-gradient(160deg,var(--moon-bg1),var(--moon-bg2));}
  .tile.star{background:linear-gradient(160deg,var(--star-bg1),var(--star-bg2));}
  .tile.cloud{background:linear-gradient(160deg,var(--cloud-bg1),var(--cloud-bg2));}
  .tile.fly-in{animation:tileFlyIn .42s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes tileFlyIn{
    from{ transform:translate(var(--fx,0),var(--fy,0)) scale(.5) rotate(var(--fr,0deg)); opacity:0; }
    to{ transform:translate(0,0) scale(1) rotate(0deg); opacity:1; }
  }
  .seat.playing .avatar{animation:seatPulse .42s ease;}
  @keyframes seatPulse{
    0%{ box-shadow:0 0 0 0 #e8c27a00; }
    40%{ box-shadow:0 0 0 6px #e8c27a66; }
    100%{ box-shadow:0 0 0 0 #e8c27a00; }
  }

  /* log */
  #log{position:absolute;bottom:8px;left:8px;right:8px;max-height:60px;overflow:hidden;font-size:10.5px;color:#f5ecd7cc;
    line-height:1.5;text-shadow:0 1px 2px #000;cursor:pointer;padding:4px 6px;border-radius:8px;word-break:break-word;}
  #log:active{background:#00000030;}
  .logFull{max-height:50vh;overflow-y:auto;font-size:12px;line-height:1.9;color:#f5ecd7;background:#00000030;border-radius:10px;padding:10px 12px;margin-bottom:12px;}

  /* hand */
  #handWrap{position:relative;padding:6px 6px 10px;background:linear-gradient(180deg, transparent, #170e20 40%);}
  #feedback{text-align:center;font-size:11px;color:#ef9d7d;min-height:14px;margin-bottom:2px;}
  /* 손패가 1줄이든 2줄이든 항상 같은 높이를 차지하도록 고정 높이 + 세로 중앙 정렬 */
  #myHand{display:flex;flex-wrap:wrap;align-content:center;gap:6px;justify-content:center;padding:2px 8px;height:136px;overflow-y:auto;}
  #myHand::-webkit-scrollbar{display:none;}
  .htile{width:40px;height:54px;border-radius:7px;background:linear-gradient(160deg,#fffdf6,#e9dfc4);
    box-shadow:0 2px 4px #00000060;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;flex-shrink:0;transition:transform .15s ease, box-shadow .15s ease;cursor:pointer;margin-top:10px;}
  .htile .num{font-family:'Black Han Sans';font-size:19px;line-height:1;}
  .htile .suit{font-size:11px;position:absolute;bottom:3px;right:4px;}
  .htile.sun .num{color:var(--sun);}
  .htile.moon .num{color:var(--moon);}
  .htile.star .num{color:var(--star);}
  .htile.cloud .num{color:var(--cloud);}
  .htile.sun{background:linear-gradient(160deg,var(--sun-bg1),var(--sun-bg2));}
  .htile.moon{background:linear-gradient(160deg,var(--moon-bg1),var(--moon-bg2));}
  .htile.star{background:linear-gradient(160deg,var(--star-bg1),var(--star-bg2));}
  .htile.cloud{background:linear-gradient(160deg,var(--cloud-bg1),var(--cloud-bg2));}
  .htile.selected{transform:translateY(-10px);box-shadow:0 0 0 2px var(--gold-bright), 0 6px 10px #00000070;}

  #actionBar{display:flex;gap:6px;padding:0 8px;}
  #recommendBtn{flex:0.8;}
  #sortBtn{flex:0.8;}
  #recommendBtn,#sortBtn{padding:12px 4px;font-size:12.5px;}
  .btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#2a1c0d;}
  .btn:active{filter:brightness(.92);}
  .btn:disabled{opacity:.35;filter:grayscale(.4);cursor:default;}
  .btn.ghost{background:#00000030;color:var(--ivory);border:1px solid var(--line);}

  /* modal */
  #modalOverlay{position:fixed;inset:0;background:#000000a0;display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  #modalOverlay.show{display:flex;}
  #modalBox{background:linear-gradient(180deg,#3a2555,#20142f);border:1px solid var(--gold);border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:82vh;overflow-y:auto;}
  #modalBox h2{color:var(--gold-bright);font-family:'Black Han Sans';margin:0 0 10px;text-align:center;letter-spacing:1px;}
  #modalBox p.sub{color:var(--ivory);opacity:.85;font-size:13px;line-height:1.6;margin:0 0 14px;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .score-row{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid #ffffff15;font-size:13px;}
  .score-row .val{font-weight:800;}
  .score-row .val.pos{color:#8ee0a8;}
  .score-row .val.neg{color:#ef9d7d;}
  .score-row .val .cur{font-weight:600;font-size:11px;color:var(--ivory-dim,#c9b89a);opacity:.75;margin-left:4px;}
  .rank-row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #ffffff15;}
  .rank-row .medal{font-family:'Black Han Sans';color:var(--gold-bright);width:26px;}

  /* setup / rule modal extras */
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .suit-opt{flex:1;min-width:70px;text-align:center;padding:10px 4px;border-radius:10px;
    border:1px solid var(--line);cursor:pointer;font-size:14px;background:#00000030;color:var(--ivory);overflow:hidden;}
  .suit-opt.sel{border-color:var(--gold-bright);background:#f0cd8a22;box-shadow:0 0 10px #f0cd8a44;color:var(--gold-bright);font-weight:800;}

  /* 정산 내역 (누구한테 얼마 받고 주고) */
  .settle-title{font-size:11px;color:var(--ivory);opacity:.7;margin:12px 0 4px;}
  .settle-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
  .settle-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 8px;border-radius:8px;background:#00000025;}
  .settle-row .amt{color:#ef9d7d;font-weight:800;}

  /* 레벨 / xp */
  #ruleBtn{background:none;border:1px solid var(--line);color:var(--ivory);border-radius:50%;width:26px;height:26px;
    font-size:13px;font-weight:800;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
  #ruleBtn:active{background:#00000040;}
  #sfxToggle{background:none;border:1px solid var(--line);color:var(--ivory);border-radius:50%;width:26px;height:26px;
    font-size:13px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
  #sfxToggle:active{background:#00000040;}
  .status-badge.lvl{color:#f0cd8a;border-color:#e8c27a88;font-weight:800;}
  .xp-bar-wrap{background:#00000045;border-radius:8px;height:10px;overflow:hidden;margin:4px 0 2px;}
  .xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:8px;transition:width .5s ease;}
  .xp-gain-row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 2px;color:var(--ivory);opacity:.85;}

  /* ---------- 라운드별 XP / 레벨 정산 (마이티 온라인 스타일) ---------- */
  .xpModal{ text-align:center; }
  .xpLevelRow{ display:flex; align-items:center; justify-content:center; gap:14px; margin:6px 0 16px; }
  .xpLevelBadge{
    width:72px;height:72px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#3a2a0a;font-family:'Black Han Sans';box-shadow:0 4px 14px #00000060, 0 0 0 3px #e8c27a44;
    position:relative; flex-shrink:0; overflow:hidden;
  }
  .xpLevelBadge .lv-num{font-size:24px;line-height:1;}
  .xpLevelBadge .lv-label{font-size:9px;letter-spacing:1px;margin-top:1px;}
  .xpLevelBadge.leveling{ animation: levelBounce 0.7s ease; }
  @keyframes levelBounce{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.35) rotate(-6deg); box-shadow:0 4px 26px #e8c27acc, 0 0 0 6px #e8c27a66; }
    55%{ transform:scale(0.92) rotate(4deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  .xpBarWrap{ flex:1; text-align:left; min-width:0; }
  .xpBarLabel{ display:flex; justify-content:space-between; font-size:11px; color:#f5ecd7cc; margin-bottom:4px; gap:6px; }
  .xpBarLabel>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .xpBarTrack{ width:100%; height:14px; border-radius:8px; background:#00000045; overflow:hidden; border:1px solid #ffffff1a; }
  .xpBarFill{
    height:100%; width:0%; border-radius:8px;
    background:linear-gradient(90deg,var(--gold),var(--gold-bright));
    box-shadow:0 0 10px #e8c27a88;
    transition: width 0.9s cubic-bezier(.2,.8,.3,1);
  }
  .xpGainText{
    font-family:'Black Han Sans'; font-size:26px; color:var(--gold-bright);
    margin:2px 0 6px; opacity:0; transform:translateY(6px);
    animation: xpGainIn 0.5s ease forwards 0.15s;
  }
  @keyframes xpGainIn{ to{ opacity:1; transform:translateY(0); } }
  .levelUpBanner{
    font-family:'Black Han Sans'; font-size:20px; letter-spacing:1px;
    color:#3a2a0a; background:linear-gradient(90deg,var(--gold-bright),#ffe9b8,var(--gold-bright));
    border-radius:12px; padding:10px 14px; margin:4px 0 16px;
    opacity:0; transform:scale(.85);
    animation: levelUpIn 0.55s cubic-bezier(.34,1.56,.64,1) forwards 0.35s;
    box-shadow:0 6px 20px #e8c27a55;
    overflow-wrap:break-word;
  }
  @keyframes levelUpIn{ to{ opacity:1; transform:scale(1); } }
  .xpBreakdown{ text-align:left; margin:4px 0 16px; }
  .xpBreakdown .xpRow{
    display:flex; justify-content:space-between; font-size:12.5px;
    padding:6px 10px; border-radius:8px; background:#00000030; margin-bottom:5px;
    opacity:0; transform:translateX(-8px);
    animation: xpRowIn 0.35s ease forwards;
    gap:6px;overflow:hidden;
  }
  .xpBreakdown .xpRow>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .xpBreakdown .xpRow .amt{ color:#8ee0a8; font-weight:800; flex-shrink:0; }
  @keyframes xpRowIn{ to{ opacity:1; transform:translateX(0); } }
  .xpStreak{
    display:inline-block; font-size:11px; color:#f0cd8a; background:#f0cd8a22;
    border:1px solid #f0cd8a55; border-radius:16px; padding:3px 10px; margin-bottom:10px;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .confettiWrap{ position:relative; height:0; overflow:visible; }
  .confetti{
    position:absolute; top:-10px; font-size:16px;
    animation: confettiFall 1.4s ease-in forwards;
    opacity:0.95;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(140px) rotate(340deg); opacity:0; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand title-font">렉시오<span class="ver-tag">v0.016</span><span>LEXIO · 나 + 영호·옥순·순자</span></div>
    <div id="roundTag">준비 중</div>
    <button id="sfxToggle" title="효과음 켜기/끄기">🔊</button>
    <button id="ruleBtn" title="규칙 보기">?</button>
    <button id="newGameBtn">새 매치</button>
  </div>
  <div id="statusStrip"></div>
  <div id="table">
    <div id="seats"></div>
    <div id="centerArea">
      <div id="lastComboLabel"></div>
      <div id="lastComboTiles"></div>
      <div id="turnFlash"></div>
    </div>
    <div id="log"></div>
  </div>
  <div id="handWrap">
    <div id="feedback"></div>
    <div id="myHand"></div>
    <div id="actionBar">
      <button class="btn ghost" id="recommendBtn">💡 추천</button>
      <button class="btn ghost" id="sortBtn">🔀 숫자순</button>
      <button class="btn ghost" id="passBtn">패스</button>
      <button class="btn" id="playBtn">내기</button>
    </div>
  </div>
</div>

<div id="modalOverlay"><div id="modalBox"></div></div>

<script>
(function(){

/* ============================ 기본 정의 ============================ */
const SUITS = [
  {id:'sun',   symbol:'☀️', label:'해',   order:3},
  {id:'moon',  symbol:'🌙', label:'달',   order:2},
  {id:'star',  symbol:'⭐', label:'별',   order:1},
  {id:'cloud', symbol:'☁️', label:'구름', order:0},
];
const N_PLAYERS = 4;
const NUM_MAX = 13;
const TOTAL_ROUNDS = 5;

/* ============================ 효과음 (Web Audio API로 직접 합성) ============================
   외부 mp3 링크는 사이트의 핫링크 차단 정책 때문에 재생이 안 되는 경우가 많아서,
   브라우저 안에서 직접 소리를 만들어내는 방식으로 구현했습니다. 네트워크나 외부 사이트
   상태와 무관하게 항상 재생됩니다. (마이티 온라인과 동일한 구조)
*/
let sfxCtx = null;
let sfxMuted = false;
let sfxUnlocked = false;
function ensureSfxCtx(){
  if(!sfxCtx){
    try{ sfxCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return sfxCtx;
}
// 아이폰 사파리는 화면 전환/전화 수신 등으로 오디오 컨텍스트가 "suspended" 뿐 아니라
// "interrupted" 상태가 되기도 한다. running이 아니면 상태와 무관하게 무조건 재개를 시도한다.
function resumeSfxCtx(){
  const ctx = sfxCtx;
  if(!ctx) return Promise.resolve(null);
  if(ctx.state==="running") return Promise.resolve(ctx);
  return ctx.resume().then(()=>ctx).catch(()=>ctx);
}
function getSfxCtx(){
  const ctx = ensureSfxCtx();
  if(ctx && ctx.state!=="running") resumeSfxCtx();
  return ctx;
}
// 아이폰 사파리는 실제 사용자 터치 이벤트 "안에서" 오디오를 한 번 재생해야 이후 자동(타이머 등) 재생도
// 막히지 않는다. 화면을 처음 탭/클릭하는 순간 무음 버퍼를 한 번 실제로 재생시켜 잠금을 확실히 풀어둔다.
function unlockSfxOnce(){
  if(sfxUnlocked) return;
  sfxUnlocked = true;
  const ctx = ensureSfxCtx();
  if(!ctx) return;
  try{
    const buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    src.start(0);
  }catch(e){}
  resumeSfxCtx();
}
["touchstart","touchend","pointerdown","mousedown","click","keydown"].forEach(evt=>{
  document.addEventListener(evt, unlockSfxOnce, {once:true, passive:true});
});
// 다른 화면(앱 전환 등)에 나갔다 돌아왔을 때 오디오 컨텍스트가 잠들어 있을 수 있어 다시 깨워준다.
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) resumeSfxCtx(); });
// 하나의 톤(oscillator)을 짧게 재생. freq: 주파수(Hz) 또는 [시작,끝] 배열(글리산도), type: 파형
function sfxTone(ctx, freq, startTime, duration, {type="sine", gain=0.18, attack=0.005, release=0.05}={}){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  if(Array.isArray(freq)){
    osc.frequency.setValueAtTime(freq[0], startTime);
    osc.frequency.linearRampToValueAtTime(freq[1], startTime+duration);
  } else {
    osc.frequency.setValueAtTime(freq, startTime);
  }
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(gain, startTime+attack);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime+duration+release);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime+duration+release+0.02);
}
const SFX_PATTERNS = {
  // 타일 내는 소리: 짧고 마른 클릭
  tile: (ctx,t)=>{ sfxTone(ctx, [1400,700], t, 0.035, {type:"square", gain:0.12, release:0.02}); },
  // 패스: 낮고 짧은 둔탁한 소리
  pass: (ctx,t)=>{ sfxTone(ctx, [260,180], t, 0.06, {type:"sine", gain:0.1, release:0.03}); },
  // 라운드 승리(타일 다 냄): 밝은 2음 차임
  roundwin: (ctx,t)=>{
    sfxTone(ctx, 880, t, 0.09, {type:"triangle", gain:0.16});
    sfxTone(ctx, 1318.5, t+0.09, 0.14, {type:"triangle", gain:0.16});
  },
  // 매치 승리(최종 1위): 상승 아르페지오 팡파레
  win: (ctx,t)=>{
    [523.25,659.25,783.99,1046.5].forEach((f,i)=> sfxTone(ctx, f, t+i*0.11, 0.16, {type:"triangle", gain:0.17}));
  },
  // 매치 패배(최종 1위 아님): 낮게 처지는 버저
  lose: (ctx,t)=>{
    sfxTone(ctx, [330,140], t, 0.35, {type:"sawtooth", gain:0.16, release:0.08});
  },
  // 레벨업: 반짝이는 상승 차임 + 마무리 화음
  levelup: (ctx,t)=>{
    [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=> sfxTone(ctx, f, t+i*0.075, 0.13, {type:"triangle", gain:0.16}));
    sfxTone(ctx, 1567.98, t+0.4, 0.3, {type:"triangle", gain:0.14});
  },
};
function sfxPlay(key){
  if(sfxMuted) return;
  try{
    const ctx = getSfxCtx();
    if(!ctx) return;
    const pattern = SFX_PATTERNS[key];
    if(!pattern) return;
    if(ctx.state!=="running"){
      // 아직 잠겨있는 상태라면 그냥 버리지 않고, 깨어나는 대로 재생한다.
      resumeSfxCtx().then((resumedCtx)=>{
        if(resumedCtx && resumedCtx.state==="running" && !sfxMuted) pattern(resumedCtx, resumedCtx.currentTime);
      });
      return;
    }
    pattern(ctx, ctx.currentTime);
  }catch(e){ /* 무시 */ }
}

function suitObj(id){ return SUITS.find(s=>s.id===id); }
function suitOrder(id){ return suitObj(id).order; }
function tileId(t){ return t.suit+'-'+t.num; }
function numStrength(n){ return n===2?15:(n===1?14:n); }
function singleValue(t){ return numStrength(t.num)*10 + suitOrder(t.suit); }

function buildDeck(){
  const deck=[];
  for(const s of SUITS) for(let n=1;n<=NUM_MAX;n++) deck.push({suit:s.id, num:n});
  return deck;
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function sortHandInPlace(h){ h.sort((a,b)=>singleValue(a)-singleValue(b)); }
// 손패 정렬 모드: 'number'=숫자 우선순위, 'suit'=무늬 우선순위
let handSortMode = 'number';
function sortByNumberPriority(h){ h.sort((a,b)=>singleValue(a)-singleValue(b)); }
function sortBySuitPriority(h){ h.sort((a,b)=> (suitOrder(a.suit)-suitOrder(b.suit)) || (numStrength(a.num)-numStrength(b.num)) ); }
function applyCurrentHandSort(h){ if(handSortMode==='suit') sortBySuitPriority(h); else sortByNumberPriority(h); }

function kCombos(arr,k){
  const res=[]; const combo=[];
  (function rec(start){
    if(combo.length===k){ res.push(combo.slice()); return; }
    for(let i=start;i<arr.length;i++){ combo.push(arr[i]); rec(i+1); combo.pop(); }
  })(0);
  return res;
}

/* ============================ 조합 판정 ============================ */
function detectStraightNums(nums){
  const sorted=[...nums].sort((a,b)=>a-b);
  if(new Set(sorted).size!==5) return null;
  if(sorted[4]-sorted[0]===4) return {top:sorted[4], topNum:sorted[4]};
  if(sorted.join(',')==='1,10,11,12,13') return {top:14, topNum:1};
  return null;
}
function detectMade(tiles){
  const nums=tiles.map(t=>t.num);
  const tally={};
  nums.forEach(n=>tally[n]=(tally[n]||0)+1);
  const counts=Object.values(tally).sort((a,b)=>b-a);
  const isFlush = tiles.every(t=>t.suit===tiles[0].suit);
  const straight = counts.length===5 ? detectStraightNums(nums) : null;

  if(counts[0]===4){
    const quadNum=Number(Object.keys(tally).find(k=>tally[k]===4));
    return {category:4, label:'포카드', value:numStrength(quadNum)*10, key:quadNum};
  }
  if(counts[0]===3 && counts[1]===2){
    const tripleNum=Number(Object.keys(tally).find(k=>tally[k]===3));
    return {category:3, label:'풀하우스', value:numStrength(tripleNum)*10, key:tripleNum};
  }
  if(counts.length===5){
    if(straight && isFlush){
      const topTile = tiles.find(t=>t.num===straight.topNum);
      return {category:5, label:'스트레이트플러시', value:straight.top*10+suitOrder(topTile.suit), key:straight.top};
    }
    if(straight){
      const topTile = tiles.find(t=>t.num===straight.topNum);
      return {category:1, label:'스트레이트', value:straight.top*10+suitOrder(topTile.suit), key:straight.top};
    }
    if(isFlush){
      const flushRank = tiles.map(t=>numStrength(t.num)).sort((a,b)=>b-a);
      return {category:2, label:'플러시', value:0, flushRank, key:tiles[0].suit};
    }
  }
  return null;
}
function compareMade(a,b){
  if(a.category!==b.category) return a.category>b.category;
  if(a.category===2){
    for(let i=0;i<5;i++){ if(a.flushRank[i]!==b.flushRank[i]) return a.flushRank[i]>b.flushRank[i]; }
    return false;
  }
  return a.value>b.value;
}
function tilesStr(tiles){ return tiles.map(t=>`${t.num}${suitObj(t.suit).symbol}`).join(' '); }
function describeCombo(c){
  if(c.kind==='single') return `싱글 (${tilesStr(c.tiles)})`;
  if(c.kind==='pair') return `페어 (${tilesStr(c.tiles)})`;
  if(c.kind==='triple') return `트리플 (${tilesStr(c.tiles)})`;
  return `${c.made.label} (${tilesStr(c.tiles)})`;
}
function evaluatePlay(tiles, requiredCount){
  const count=tiles.length;
  if(count===0) return {ok:false, reason:'타일을 선택해주세요.'};
  if(requiredCount!=null && count!==requiredCount) return {ok:false, reason:`${requiredCount}장을 내야 합니다.`};
  if(![1,2,3,5].includes(count)) return {ok:false, reason:'1, 2, 3, 5장만 낼 수 있습니다 (4장 불가).'};
  if(count===1) return {ok:true, combo:{count:1, kind:'single', strength:singleValue(tiles[0]), tiles}};
  if(count===2){
    if(tiles[0].num!==tiles[1].num) return {ok:false, reason:'페어는 같은 숫자여야 합니다.'};
    const strength=numStrength(tiles[0].num)*10+Math.max(suitOrder(tiles[0].suit),suitOrder(tiles[1].suit));
    return {ok:true, combo:{count:2, kind:'pair', strength, tiles}};
  }
  if(count===3){
    if(!(tiles[0].num===tiles[1].num && tiles[1].num===tiles[2].num)) return {ok:false, reason:'트리플은 같은 숫자 3개여야 합니다.'};
    const strength=numStrength(tiles[0].num)*10+Math.max(...tiles.map(t=>suitOrder(t.suit)));
    return {ok:true, combo:{count:3, kind:'triple', strength, tiles}};
  }
  const made=detectMade(tiles);
  if(!made) return {ok:false, reason:'유효한 5장 조합(스트레이트/플러시/풀하우스/포카드/스트플)이 아닙니다.'};
  return {ok:true, combo:{count:5, kind:'made', made, tiles}};
}
function beatsCombo(newCombo, prevCombo){
  if(!prevCombo) return true;
  if(newCombo.kind==='made') return compareMade(newCombo.made, prevCombo.made);
  return newCombo.strength > prevCombo.strength;
}

const AI_NAMES = {1:'영호', 2:'옥순', 3:'순자'};
/* ============================ AI ============================ */
// ---- 몬테카를로 시뮬레이션 보조 함수 ----
// hand 배열이 실제 G.players[i].hand 참조와 같을 때만(=진짜 내 턴일 때만) selfIdx를 찾는다.
// 시뮬레이션 내부에서는 복사된 배열을 쓰므로 여기서 -1이 나와 재귀적으로 몬테카를로가
// 중첩 실행되는 것을 자연스럽게 막는다.
function aiSelfIdxOf(hand){
  if(typeof G==='undefined' || !G || !G.players) return -1;
  return G.players.findIndex(p=>p.hand===hand);
}
// 어떤 수를 둔 뒤 라운드가 끝날 때까지 굴려서, selfIdx가 먼저 손을 털었는지(=승리) 여부를 반환
function simulateAfterMove(selfIdx, tiles, requiredCount, prevCombo){
  const ev=evaluatePlay(tiles, requiredCount);
  if(!ev.ok) return false;
  const hands=G.players.map(p=>p.hand.slice());
  const ids=tiles.map(tileId);
  hands[selfIdx]=hands[selfIdx].filter(t=>!ids.includes(tileId(t)));
  if(hands[selfIdx].length===0) return true;
  const lastCombo={...ev.combo, tiles, owner:selfIdx};
  const turn=TURN_ORDER[(TURN_ORDER.indexOf(selfIdx)+1)%TURN_ORDER.length];
  const winner=aiRolloutToEnd(hands, turn, lastCombo, ev.combo.count, 0);
  return winner===selfIdx;
}
// 나머지 라운드를 (기존 휴리스틱 AI로) 끝까지 굴려서 최종적으로 손을 다 턴 플레이어의 idx를 반환
function aiRolloutToEnd(hands, turn, lastCombo, requiredCount, passCount){
  const order=TURN_ORDER;
  let leader = lastCombo ? lastCombo.owner : turn;
  for(let steps=0; steps<250; steps++){
    const dangerNow = hands.some((h,i)=>i!==turn && h.length<=2);
    let tiles = hands[turn].length ? aiFindPlay(hands[turn], requiredCount, lastCombo, dangerNow) : null;
    let played=false;
    if(tiles){
      const ev=evaluatePlay(tiles, requiredCount);
      if(ev.ok && (requiredCount==null || beatsCombo(ev.combo, lastCombo))){
        const ids=tiles.map(tileId);
        hands[turn]=hands[turn].filter(t=>!ids.includes(tileId(t)));
        lastCombo={...ev.combo, tiles, owner:turn};
        requiredCount=ev.combo.count;
        passCount=0;
        played=true;
        if(hands[turn].length===0) return turn;
      }
    }
    if(!played){
      if(requiredCount==null){
        // 안전망: 선인데 낼 게 없다고 나오면 가장 낮은 싱글을 강제로 낸다(이론상 거의 발생 안 함)
        const sorted=hands[turn].slice().sort((a,b)=>singleValue(a)-singleValue(b));
        if(!sorted.length) return turn;
        const t=sorted[0];
        hands[turn]=hands[turn].filter(x=>tileId(x)!==tileId(t));
        lastCombo={count:1,kind:'single',strength:singleValue(t),tiles:[t],owner:turn};
        requiredCount=1; passCount=0;
        if(hands[turn].length===0) return turn;
      } else {
        passCount++;
        if(passCount>=N_PLAYERS-1){
          leader=lastCombo.owner;
          turn=leader;
          lastCombo=null; requiredCount=null; passCount=0;
          continue;
        }
      }
    }
    turn=order[(order.indexOf(turn)+1)%order.length];
  }
  return -1;
}
// 후보 수들 중 몬테카를로 승률이 가장 높은 것을 고른다 (동률 시 먼저 나온 후보 우선)
function aiPickByMonteCarlo(selfIdx, candidateTilesList, requiredCount, prevCombo, rollouts){
  let best=candidateTilesList[0], bestScore=-1;
  for(const tiles of candidateTilesList){
    let wins=0;
    for(let r=0;r<rollouts;r++){ if(simulateAfterMove(selfIdx, tiles, requiredCount, prevCombo)) wins++; }
    const score=wins/rollouts;
    if(score>bestScore){ bestScore=score; best=tiles; }
  }
  return best;
}

function aiFindPlay(hand, requiredCount, prevCombo, dangerNow){
  const tally={};
  hand.forEach(t=>{ (tally[t.num]=tally[t.num]||[]).push(t); });
  // 어떤 숫자를 가진 타일이 몇 장 모여있는지(=더 상위 조합을 만들 수 있는 잠재력)
  function groupSize(num){ return (tally[num]||[]).length; }
  // 나 말고 다른 누군가가 2장 이하로 남아있으면, 그 사람은 싱글/페어 한 방으로 라운드를
  // 끝낼 확률이 높다. 이럴 땐 "가장 싼 패로 이기고 강패는 나중에 아껴둔다"는 평소 정석이
  // 오히려 위험하다 — "나중"이 오기 전에 게임이 끝나버릴 수 있기 때문에, 지금 이 순간
  // 가장 높은 패로 확실히 견제(=주도권을 붙잡아두는 것)하는 쪽이 낫다.
  if(dangerNow===undefined){
    const selfIdx=aiSelfIdxOf(hand);
    dangerNow = selfIdx>=0 && G.players.some((p,i)=>i!==selfIdx && p.hand.length<=2);
  }

  if(requiredCount==null){
    // 손패가 딱 5장이고 그 자체로 유효 족보면 즉시 낸다 (막판 필승 패턴)
    if(hand.length===5){
      const ev=evaluatePlay(hand,null);
      if(ev.ok) return hand;
    }

    const byNum = Object.keys(tally).map(Number).sort((a,b)=>numStrength(a)-numStrength(b));
    const singleNums = byNum.filter(n=>groupSize(n)===1);
    const pairNums = byNum.filter(n=>groupSize(n)>=2);
    const tripleNums = byNum.filter(n=>groupSize(n)>=3);

    // ---- 리드 후보 생성 ----
    // (a) 조합이 안 되는(고립된) 싱글부터 우선 후보로: 나중에 상대가 내 패를 읽기 어렵게
    //     중간에 짝이 안 맞는 패를 먼저 털어낸다.
    const candidates=[];
    (singleNums.length?singleNums:byNum).slice(0,3).forEach(n=>{
      const t=tally[n].slice().sort((a,b)=>singleValue(a)-singleValue(b))[0];
      candidates.push(t?[t]:null);
    });
    // (b) 페어 후보 — 싱글보다 상대가 따라 내기 어려운 조합이라 리드로 적극 고려한다.
    pairNums.slice(0,2).forEach(n=>{
      const sorted=tally[n].slice().sort((a,b)=>suitOrder(a.suit)-suitOrder(b.suit));
      candidates.push(sorted.slice(0,2));
    });
    // (c) 트리플 후보 — 페어보다도 더 따라 내기 어려운 강한 견제 패.
    tripleNums.slice(0,1).forEach(n=>{
      const sorted=tally[n].slice().sort((a,b)=>suitOrder(a.suit)-suitOrder(b.suit));
      candidates.push(sorted.slice(0,3));
    });
    // (d) 5장 족보는 강패이므로 후반(손패 8장 이하)에만 리드 후보로 고려해 아껴둔다.
    if(hand.length>5 && hand.length<=8){
      const combos5=kCombos(hand,5);
      let madeFound=null;
      for(const c of combos5){ const ev=evaluatePlay(c,null); if(ev.ok){ madeFound=c; break; } }
      if(madeFound) candidates.push(madeFound);
    }
    const validCandidates=candidates.filter(Boolean);
    if(!validCandidates.length){
      const sorted=[...hand].sort((a,b)=> (groupSize(a.num)-groupSize(b.num)) || (singleValue(a)-singleValue(b)) );
      return [sorted[0]];
    }

    // ---- 몬테카를로 시뮬레이션으로 승률이 가장 높은 후보를 선택 ----
    const selfIdx=aiSelfIdxOf(hand);
    if(selfIdx>=0 && validCandidates.length>1){
      return aiPickByMonteCarlo(selfIdx, validCandidates, null, prevCombo, 10);
    }
    // G 컨텍스트 없이 불릴 때(시뮬레이션 내부 등)는 가벼운 확률적 휴리스틱으로 대체
    const tripleCand=candidates.find((c,i)=>tripleNums.length && i===singleNums.slice(0,3).length+pairNums.slice(0,2).length);
    if(tripleCand && Math.random()<0.4) return tripleCand;
    const pairCand=candidates.find((c,i)=>pairNums.length && i>=singleNums.slice(0,3).length && i<singleNums.slice(0,3).length+pairNums.slice(0,2).length);
    if(pairCand && Math.random()<0.5) return pairCand;
    return validCandidates[0];
  }
  const count=requiredCount;
  let candidates=[];
  if(count===1){
    candidates = hand.map(t=>({tiles:[t], ev:evaluatePlay([t],1)}))
      .filter(x=>x.ev.ok && beatsCombo(x.ev.combo, prevCombo));
    // 페어/트리플/포카드를 만들 수 있는 타일(더블 이상을 만족)은 가급적 싱글로 소모하지 않는다.
    candidates.sort((a,b)=> (groupSize(a.tiles[0].num)-groupSize(b.tiles[0].num)) || (a.ev.combo.strength-b.ev.combo.strength) );
  } else if(count===2 || count===3){
    candidates = kCombos(hand,count).map(c=>({tiles:c, ev:evaluatePlay(c,count)}))
      .filter(x=>x.ev.ok && beatsCombo(x.ev.combo, prevCombo));
    // 트리플/포카드를 만들 수 있는 숫자를 쪼개 페어로 내기보다, 정확히 그 개수만큼만 있는
    // (=더 상위 족보로 이어지지 않는) 조합을 우선한다. 단, danger 상황에서는 조합 보존보다
    // 확실한 견제가 우선이므로 강한 패부터 우선한다.
    candidates.sort((a,b)=> dangerNow
      ? (b.ev.combo.strength-a.ev.combo.strength)
      : ((groupSize(a.tiles[0].num)-groupSize(b.tiles[0].num)) || (a.ev.combo.strength-b.ev.combo.strength)));
  } else if(count===5){
    candidates = kCombos(hand,5).map(c=>({tiles:c, ev:evaluatePlay(c,5)}))
      .filter(x=>x.ev.ok && beatsCombo(x.ev.combo, prevCombo));
    candidates.sort((a,b)=> (a.ev.combo.made.category-b.ev.combo.made.category) ||
      (a.ev.combo.made.category===2 ? 0 : a.ev.combo.made.value-b.ev.combo.made.value));
  }
  if(!candidates.length) return null;
  if(count===1){
    // 평소엔 "딱 이길 수 있는 가장 낮은 패로 이기고, 높은 싱글은 나중에 상대의 강한
    // 패를 견제할 카드로 아껴둔다"가 정석이지만, 누군가 2장 이하로 남아 곧 끝낼 위험이
    // 있을 땐 아껴둘 "나중"이 없을 수 있으므로 가장 높은 패로 확실히 견제한다.
    if(dangerNow){
      const strongest=candidates.slice().sort((a,b)=>b.ev.combo.strength-a.ev.combo.strength)[0];
      return strongest.tiles;
    }
    return candidates[0].tiles;
  }
  // 페어/트리플/5장 조합은 어떤 걸 깨서 내는 게 유리한지가 더 복잡하므로, 상위 후보 중
  // 몬테카를로로 승률이 가장 높은 패를 골라서 낸다.
  const selfIdx=aiSelfIdxOf(hand);
  if(selfIdx>=0 && candidates.length>1){
    const shortlist=candidates.slice(0,4).map(x=>x.tiles);
    return aiPickByMonteCarlo(selfIdx, shortlist, requiredCount, prevCombo, 8);
  }
  return candidates[0].tiles;
}

/* ============================ 경험치 / 레벨 프로필 (매치와 무관하게 영구 저장) ============================ */
const profile = { level:1, xp:0, totalGames:0, totalWins:0, totalRounds:0, totalRoundWins:0, currentStreak:0, bestStreak:0 };
async function loadProfile(){
  try{
    const raw = localStorage.getItem('lexio_profile');
    if(raw){ const data=JSON.parse(raw); if(data) Object.assign(profile, data); }
  }catch(e){ /* 첫 실행 */ }
}
async function saveProfile(){ try{ localStorage.setItem('lexio_profile', JSON.stringify(profile)); }catch(e){} }
function xpToNextLevel(level){ return 100 + (level-1)*35; }
function levelProgressPercent(level, xp){ return Math.max(0, Math.min(100, (xp/xpToNextLevel(level))*100)); }
// 라운드가 끝날 때마다(마이티 온라인처럼) 그 라운드 성적을 기준으로 XP를 정산한다.
function computeRoundXpGain(rank, myScore, scores){
  const breakdown=[];
  if(rank===0){ breakdown.push({label:'🏆 라운드 1위', amount:14}); }
  else if(rank===1){ breakdown.push({label:'🥈 라운드 2위', amount:4}); }
  else if(rank===2){ breakdown.push({label:'🥉 라운드 3위', amount:-3}); }
  else{ breakdown.push({label:'라운드 4위', amount:-8}); }
  const avgOthers = (scores.reduce((a,b)=>a+b,0)-myScore) / (scores.length-1);
  const margin = myScore-avgOthers;
  if(rank===0 && margin>0){ const bonus=Math.max(0,Math.min(12,Math.round(margin/3))); if(bonus>0) breakdown.push({label:'💥 압승 보너스', amount:bonus}); }
  if(rank===0){ profile.currentStreak+=1; profile.bestStreak=Math.max(profile.bestStreak, profile.currentStreak); }
  else{ profile.currentStreak=0; }
  if(rank===0 && profile.currentStreak>=2){ const sb=Math.min(15,(profile.currentStreak-1)*3); breakdown.push({label:`🔥 ${profile.currentStreak}라운드 연승`, amount:sb}); }
  const xp = breakdown.reduce((s,b)=>s+b.amount,0);
  return {xp, breakdown};
}
function applyXpGain(gain){
  const startLevel=profile.level, startXp=profile.xp;
  profile.xp += gain;
  const levelUps=[], levelDowns=[];
  while(profile.xp >= xpToNextLevel(profile.level)){ profile.xp -= xpToNextLevel(profile.level); profile.level+=1; levelUps.push(profile.level); }
  while(profile.xp < 0 && profile.level>1){ profile.level-=1; profile.xp += xpToNextLevel(profile.level); levelDowns.push(profile.level); }
  if(profile.level<=1 && profile.xp<0) profile.xp=0;
  return {startLevel, startXp, levelUps, levelDowns};
}
// 이번 라운드 결과(roundScores)를 이 기기의 영구 프로필(레벨/XP)에 반영한다.
function applyRoundResultToProfile(roundScores){
  const order=[0,1,2,3].slice().sort((a,b)=>roundScores[b]-roundScores[a]);
  const rank = order.indexOf(0);
  profile.totalRounds += 1;
  if(rank===0) profile.totalRoundWins += 1;
  const {xp:xpGain, breakdown} = computeRoundXpGain(rank, roundScores[0], roundScores);
  const {startLevel, startXp, levelUps, levelDowns} = applyXpGain(xpGain);
  saveProfile();
  return {rank, xpGain, breakdown, startLevel, startXp, levelUps, levelDowns, streak:profile.currentStreak};
}
// 매치 전체가 끝났을 때(최종 순위) 누적 전적만 별도로 기록한다. (XP는 이미 라운드마다 정산됨)
function applyMatchResultToProfile(){
  const order=[0,1,2,3].slice().sort((a,b)=>matchState.scores[b]-matchState.scores[a]);
  const rank = order.indexOf(0);
  profile.totalGames += 1;
  if(rank===0) profile.totalWins += 1;
  saveProfile();
  return {rank};
}

/* ============================ 상태 ============================ */
let G = null;
let matchState = { round:1, totalRounds:TOTAL_ROUNDS, endMode:'rounds', startScore:0, scores:[0,0,0,0], history:[], matchOver:false };
let selection = new Set();
let feedbackTimer = null;
let lastRenderedComboKey = null;

function addLog(msg){ G.log.push(msg); }

/* ============================ 라운드 진행 ============================ */
function startMatch(settings){
  settings = settings || {endMode:'rounds', totalRounds:TOTAL_ROUNDS, startScore:0};
  const totalRounds = settings.endMode==='bust' ? Infinity : (settings.totalRounds||TOTAL_ROUNDS);
  // 라운드제도 0점에서 시작하면 중간에 점수가 마이너스로 내려가 헷갈리므로,
  // 라운드 수 × 10점을 기본 점수로 깔고 시작한다.
  const startScore = settings.endMode==='bust' ? (settings.startScore||50) : totalRounds*10;
  matchState = {
    round:1,
    totalRounds,
    endMode: settings.endMode==='bust' ? 'bust' : 'rounds',
    startScore,
    scores:[0,0,0,0].map(()=>startScore),
    history:[],
    matchOver:false,
  };
  startRound();
  closeModal();
}
function startRound(){
  const deck=shuffle(buildDeck());
  const hands=[[],[],[],[]];
  for(let i=0;i<deck.length;i++) hands[i%N_PLAYERS].push(deck[i]);
  hands.forEach(applyCurrentHandSort);
  let leader = hands.findIndex(h=>h.some(t=>t.suit==='cloud' && t.num===3));
  if(leader<0) leader=0;
  G = {
    players:[0,1,2,3].map(i=>({idx:i, name:i===0?'나':AI_NAMES[i], isHuman:i===0, hand:hands[i]})),
    leader, turn:leader, lastCombo:null, requiredCount:null, passCount:0,
    log:[], finished:false, winner:null,
  };
  selection.clear();
  addLog(`${matchState.round}라운드 시작. ${G.players[leader].name}님이 ${suitObj('cloud').symbol}3을 가지고 있어 선을 잡았습니다.`);
  render();
  scheduleTurnIfAI();
  queueSave();
}
// 화면상 자리 배치(0:나/하단 · 1:영호/상단 · 2:옥순/우측 · 3:순자/좌측) 기준으로
// 시계방향(나 → 순자[좌] → 영호[상] → 옥순[우] → 나)으로 턴이 돌도록 순서를 고정한다.
const TURN_ORDER = [0,3,1,2];
function advanceTurn(){
  const pos = TURN_ORDER.indexOf(G.turn);
  G.turn = TURN_ORDER[(pos+1)%TURN_ORDER.length];
}

function doPlay(playerIdx, tiles){
  const ev=evaluatePlay(tiles, G.requiredCount);
  if(!ev.ok){ if(playerIdx===0) showFeedback(ev.reason); return false; }
  if(G.requiredCount!=null && !beatsCombo(ev.combo, G.lastCombo)){
    if(playerIdx===0) showFeedback('이전 조합보다 높은 조합을 내야 합니다.');
    return false;
  }
  const p=G.players[playerIdx];
  const ids=tiles.map(tileId);
  p.hand = p.hand.filter(t=>!ids.includes(tileId(t)));
  ev.combo.owner=playerIdx;
  G.lastCombo=ev.combo;
  G.requiredCount=ev.combo.count;
  G.passCount=0;
  addLog(`${p.name}: ${describeCombo(ev.combo)}`);
  sfxPlay('tile');
  selection.clear();
  if(p.hand.length===0){ finishRound(playerIdx); return true; }
  advanceTurn();
  render();
  scheduleTurnIfAI();
  queueSave();
  return true;
}
function doPass(playerIdx){
  if(G.requiredCount==null){
    if(playerIdx===0) showFeedback('선(先)은 패스할 수 없습니다. 조합을 내주세요.');
    return false;
  }
  addLog(`${G.players[playerIdx].name}: 패스`);
  sfxPlay('pass');
  G.passCount++;
  if(G.passCount>=N_PLAYERS-1){
    G.leader=G.lastCombo.owner;
    G.turn=G.leader;
    G.lastCombo=null; G.requiredCount=null; G.passCount=0;
    addLog(`${G.players[G.leader].name}님이 다시 선을 잡았습니다. 원하는 조합을 자유롭게 낼 수 있습니다.`);
  } else {
    advanceTurn();
  }
  render();
  scheduleTurnIfAI();
  queueSave();
  return true;
}
function scheduleTurnIfAI(){
  if(!G || G.finished) return;
  const p=G.players[G.turn];
  if(!p.isHuman){
    setTimeout(()=>{
      if(!G || G.finished || G.turn!==p.idx) return;
      const tiles=aiFindPlay(p.hand, G.requiredCount, G.lastCombo);
      if(tiles) doPlay(p.idx, tiles); else doPass(p.idx);
    }, 600+Math.random()*550);
  }
}
// 남은 타일 수 차이를 기준으로 누가 누구에게 얼마를 주고받는지 1:1로 전부 정산한다.
// (플레이어별 순net 점수 합계는 기존 방식과 동일하게 0이 되지만, 그 내역을 항목별로 보여줄 수 있다)
function computeTransfers(counts){
  const transfers=[];
  for(let i=0;i<N_PLAYERS;i++){
    for(let j=i+1;j<N_PLAYERS;j++){
      const diff = counts[j]-counts[i];
      if(diff>0) transfers.push({from:j, to:i, amount:diff});
      else if(diff<0) transfers.push({from:i, to:j, amount:-diff});
    }
  }
  return transfers;
}
// 숫자 2는 벌점 계산에서 중첩 페널티가 붙는다: 손에 남은 2가 1장당 벌점이 2배씩 곱해진다
// (2장이면 4배, 3장이면 8배, 4장이면 16배). 실제 남은 타일 수(표시용)와는 별개로,
// 벌점 정산에만 쓰이는 "환산 장수"를 따로 계산한다.
function effectiveCount(hand){
  const twoCount = hand.filter(t=>t.num===2).length;
  return hand.length * Math.pow(2, twoCount);
}
function finishRound(winnerIdx){
  G.finished=true; G.winner=winnerIdx;
  const counts=G.players.map(p=>p.hand.length); // 실제 남은 장수 (표시용)
  const effCounts=G.players.map(p=>effectiveCount(p.hand)); // 2 중첩 페널티를 반영한 벌점 계산용 환산 장수
  const total=effCounts.reduce((a,b)=>a+b,0);
  const roundScores=effCounts.map(c=>total-N_PLAYERS*c);
  const transfers=computeTransfers(effCounts);
  roundScores.forEach((s,i)=>matchState.scores[i]+=s);
  const isLastRound = matchState.endMode==='bust'
    ? matchState.scores.some(s=>s<=0)
    : matchState.round>=matchState.totalRounds;
  matchState.history.push({round:matchState.round, counts:counts.slice(), roundScores, transfers, winnerIdx, isLastRound});
  if(isLastRound) matchState.matchOver=true;
  addLog(`${G.players[winnerIdx].name}님이 타일을 모두 내고 라운드 승리!`);
  sfxPlay('roundwin');
  render();
  queueSave();
  // 마지막으로 낸 패를 잠깐 볼 수 있도록, 결과창은 살짝 늦게 띄운다 (AI가 냈을 때는 더 여유있게)
  const resultDelay = G.players[winnerIdx].isHuman ? 700 : 1700;
  setTimeout(()=>{
    if(!G || !G.finished || G.winner!==winnerIdx) return;
    showRoundResultModal(roundScores, counts, winnerIdx, transfers, isLastRound);
  }, resultDelay);
}

function tileEl(t, cls){
  const el=document.createElement('div');
  el.className=`${cls} ${t.suit}`;
  el.innerHTML=`<span class="num">${t.num}</span><span class="suit">${suitObj(t.suit).symbol}</span>`;
  return el;
}
const SEAT_POS = { 1:{left:'50%',top:'14%'}, 2:{left:'82%',top:'42%'}, 3:{left:'18%',top:'42%'} };
// 각 플레이어(0=나, 1=위, 2=오른쪽, 3=왼쪽)에서 중앙으로 타일이 날아오는 방향
const FLY_FROM = { 0:{fx:'0px',fy:'150px'}, 1:{fx:'0px',fy:'-140px'}, 2:{fx:'140px',fy:'0px'}, 3:{fx:'-140px',fy:'0px'} };

function render(){
  if(!G) return;
  document.getElementById('roundTag').textContent = matchState.endMode==='bust'
    ? `${matchState.round}라운드 · 점수제`
    : `${matchState.round} / ${matchState.totalRounds} 라운드`;
  const comboKey = G.lastCombo
    ? ('c:'+G.lastCombo.owner+':'+G.lastCombo.tiles.map(tileId).slice().sort().join(','))
    : ('free:'+G.leader+':'+G.passCount+':'+matchState.round);
  const isNewCombo = comboKey !== lastRenderedComboKey;
  lastRenderedComboKey = comboKey;

  // status strip
  const strip=document.getElementById('statusStrip');
  strip.innerHTML='';
  const meScore=matchState.scores[0];
  strip.appendChild(badgeEl(`Lv.${profile.level} · ${Math.round(profile.xp)}/${xpToNextLevel(profile.level)}xp`, 'lvl'));
  strip.appendChild(badgeEl(`내 점수 ${meScore}`, 'me'));
  strip.appendChild(badgeEl(`선: ${G.players[G.leader].name}`, 'leader'));
  strip.appendChild(badgeEl(`요구: ${G.requiredCount==null?'자유':G.requiredCount+'장'}`, 'turn'));

  // seats (AI 1,2,3)
  const seatsWrap=document.getElementById('seats');
  seatsWrap.innerHTML='';
  [1,2,3].forEach(i=>{
    const p=G.players[i];
    const justPlayed = isNewCombo && G.lastCombo && G.lastCombo.owner===i;
    const seat=document.createElement('div');
    seat.className='seat'+(G.turn===i?' turn':'')+(justPlayed?' playing':'');
    seat.style.left=SEAT_POS[i].left; seat.style.top=SEAT_POS[i].top;
    seat.innerHTML=`
      <div class="avatar">${p.name}${G.leader===i?'<div class="leader-badge">선</div>':''}</div>
      <div class="name">${p.name} <span class="seatScore ${matchState.scores[i]>=0?'pos':'neg'}">${matchState.scores[i]}</span></div>
      <div class="cardcount">${p.hand.length}장</div>`;
    seatsWrap.appendChild(seat);
  });

  // center: last combo
  const labelEl=document.getElementById('lastComboLabel');
  const tilesEl=document.getElementById('lastComboTiles');
  tilesEl.innerHTML='';
  if(!G.lastCombo){
    labelEl.textContent = G.finished ? `라운드 종료 · ${G.players[G.winner].name} 승리` : `${G.players[G.leader].name}님이 자유롭게 냅니다`;
  } else {
    labelEl.textContent = G.finished
      ? `라운드 종료 · ${G.players[G.winner].name} 승리`
      : `${G.players[G.lastCombo.owner].name} · ${describeCombo(G.lastCombo)}`;
    const from = FLY_FROM[G.lastCombo.owner] || FLY_FROM[0];
    G.lastCombo.tiles.forEach((t,i)=>{
      const el=tileEl(t,'tile');
      if(isNewCombo){
        el.classList.add('fly-in');
        el.style.setProperty('--fx', from.fx);
        el.style.setProperty('--fy', from.fy);
        el.style.setProperty('--fr', ((i%2===0?1:-1)*(6+i*2))+'deg');
        el.style.animationDelay=(i*0.04)+'s';
      }
      tilesEl.appendChild(el);
    });
  }
  document.getElementById('turnFlash').textContent = G.finished ? '' : (G.players[G.turn].isHuman ? '내 차례입니다' : `${G.players[G.turn].name} 차례`);

  autoSelectRecommendedForMyTurn();
  renderLog();
  renderHand();
  updateActionState();
}

  if(!G || G.finished || G.turn!==0) return;
  if(selection.size>0) return;
  const me=G.players[0];
  const tiles=aiFindPlay(me.hand, G.requiredCount, G.lastCombo);
  if(tiles) selection = new Set(tiles.map(tileId));
}
function badgeEl(text, cls){ const d=document.createElement('div'); d.className='status-badge '+(cls||''); d.textContent=text; return d; }

function renderLog(){

function renderHand(){
  const wrap=document.getElementById('myHand');

  me.hand.forEach(t=>{
    const el=tileEl(t,'htile');
    if(selection.has(tileId(t))) el.classList.add('selected');

    <div class="modal-actions"><button class="btn ghost" id="cancelNG">아니오</button><button class="btn" id="confirmNG">예</button></div>`);
  document.getElementById('cancelNG').onclick=closeModal;
  document.getElementById('confirmNG').onclick=async ()=>{ await clearSavedGame(); showSetupModal(); };
}
function showRoundResultModal(roundScores, counts, winnerIdx, transfers, isLastRound){
  if(transfers===undefined){
    // 저장된 게임을 불러와 복원하는 경우를 대비한 안전장치
    transfers = computeTransfers(counts);
  }
  if(isLastRound===undefined){
    isLastRound = matchState.endMode==='bust' ? matchState.scores.some(s=>s<=0) : matchState.round>=matchState.totalRounds;
  }
  const rows = G.players.map((p,i)=>{
    const delta=roundScores[i];
    const twoCount = (p.hand||[]).filter(t=>t.num===2).length;
    const penaltyHint = (i!==winnerIdx && twoCount>0) ? ` · <span style="color:#ef9d7d;">2 페널티 ×${Math.pow(2,twoCount)}</span>` : '';
    return `
    <div class="score-row"><span>${p.name} ${i===winnerIdx?'(승리)':`· 남은 ${counts[i]}장${penaltyHint}`}</span>
    <span class="val ${delta>=0?'pos':'neg'}">${delta>=0?'+':''}${delta}<span class="cur">(${matchState.scores[i]}점)</span></span></div>`;
  }).join('');
  const settleRows = transfers.map(t=>`
    <div class="settle-row"><span>${G.players[t.from].name} → ${G.players[t.to].name}</span><span class="amt">-${t.amount}</span></div>`).join('');
  const bustHint = matchState.endMode==='bust' && isLastRound
    ? `<p class="sub" style="text-align:center;color:#ef9d7d;">0점 이하가 된 플레이어가 있어 매치가 종료됩니다.</p>` : '';
  openModal(`<h2>${matchState.round}라운드 결과</h2>
    ${rows}
    <div class="settle-title">정산 내역</div>
    <div class="settle-list">${settleRows || '<div class="settle-row">정산할 내역이 없습니다.</div>'}</div>
    ${bustHint}
    <div class="modal-actions">
      <button class="btn ghost" id="roundLogBtn">📜 로그</button>
      <button class="btn" id="roundNextBtn">${isLastRound?'최종 결과 보기':'다음 라운드'}</button>
    </div>`);
  document.getElementById('roundNextBtn').onclick=()=>{
    showRoundXpModal(()=>{
      if(isLastRound){ showFinalResultModal(); }
      else { closeModal(); matchState.round++; startRound(); }
    });
  };
  document.getElementById('roundLogBtn').onclick=()=>{
    openLogModal(()=>showRoundResultModal(roundScores, counts, winnerIdx, transfers, isLastRound));
  };
}
// 마이티 온라인처럼, 라운드가 끝날 때마다 그 라운드 성적으로 레벨/경험치를 정산해서 보여준다.
function showRoundXpModal(onDone){
  const histEntry = matchState.history[matchState.history.length-1];
  let r = histEntry.xpResult;
  if(!histEntry.xpApplied){
    r = applyRoundResultToProfile(histEntry.roundScores);
    histEntry.xpApplied = true;
    histEntry.xpResult = r;
    queueSave();
  }
  const startLevel=r.startLevel, startXp=r.startXp;
  const endLevel=profile.level, endXp=profile.xp;
  const leveledUp = r.levelUps && r.levelUps.length>0;
  const leveledDown = r.levelDowns && r.levelDowns.length>0;
  if(leveledUp) setTimeout(()=>sfxPlay('levelup'), 850); // 레벨업 배너가 뜨는 타이밍(0.35s 지연 애니메이션)에 맞춰 재생
  if(leveledDown) setTimeout(()=>sfxPlay('lose'), 850);
  const startPct = levelProgressPercent(startLevel, startXp);
  const finalPct = levelProgressPercent(endLevel, endXp);

  const breakdownHtml = r.breakdown.map((b,i)=>
    `<div class="xpRow" style="animation-delay:${0.5+i*0.12}s"><span>${b.label}</span><span class="amt" style="${b.amount<0?'color:#ef9d7d;':''}">${b.amount>=0?'+':''}${b.amount}</span></div>`
  ).join('');

  const confettiEmojis=['🎉','✨','🎊','⭐','💫'];
  const confettiHtml = leveledUp ? Array.from({length:14}).map((_,i)=>{
    const left=Math.round(Math.random()*100);
    const delay=(Math.random()*0.4).toFixed(2);
    const emoji=confettiEmojis[i%confettiEmojis.length];
    return `<span class="confetti" style="left:${left}%;animation-delay:${delay}s;">${emoji}</span>`;
  }).join('') : '';

  openModal(`
    <div class="xpModal">
      <h2 style="text-align:center;">${r.xpGain>=0?'경험치 획득!':'경험치 감소'}</h2>
      ${leveledUp?`<div class="confettiWrap">${confettiHtml}</div>`:''}
      <div class="xpGainText" style="${r.xpGain<0?'color:#ef9d7d;':''}">${r.xpGain>=0?'+':''}${r.xpGain} XP</div>
      ${r.streak>=2?`<div class="xpStreak">🔥 ${r.streak}라운드 연승 중!</div>`:''}
      ${leveledUp?`<div class="levelUpBanner">🎉 LEVEL UP! Lv.${startLevel} → Lv.${endLevel} 🎉</div>`:''}
      ${leveledDown?`<div class="levelUpBanner" style="background:linear-gradient(90deg,#c97a7a,#e8a8a8,#c97a7a);color:#3a0a0a;">📉 LEVEL DOWN. Lv.${startLevel} → Lv.${endLevel}</div>`:''}
      <div class="xpLevelRow">
        <div class="xpLevelBadge" id="xpLevelBadge">
          <div class="lv-num" id="xpLevelNum">${startLevel}</div>
          <div class="lv-label">LEVEL</div>
        </div>
        <div class="xpBarWrap">
          <div class="xpBarLabel"><span id="xpBarLabelText">${Math.round(startXp)} / ${xpToNextLevel(startLevel)} XP</span><span>Lv.${startLevel===endLevel?endLevel:(startLevel+' → '+endLevel)}</span></div>
          <div class="xpBarTrack"><div class="xpBarFill" id="xpBarFill" style="width:${startPct}%"></div></div>
        </div>
      </div>
      <div class="xpBreakdown">${breakdownHtml}</div>
      <p class="sub" style="text-align:center;">누적 ${profile.totalRoundWins||0}승 / ${profile.totalRounds||0}라운드 · 최고 연승 ${profile.bestStreak}회</p>
      <div class="modal-actions"><button class="btn" id="xpContinueBtn">계속하기</button></div>
    </div>
  `);

  const fill=document.getElementById('xpBarFill');
  const badge=document.getElementById('xpLevelBadge');
  const lvNum=document.getElementById('xpLevelNum');
  const labelText=document.getElementById('xpBarLabelText');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(!leveledUp){
        if(fill) fill.style.width=finalPct+'%';
        if(labelText) labelText.textContent=`${Math.round(endXp)} / ${xpToNextLevel(endLevel)} XP`;
      } else {
        if(fill) fill.style.width='100%';
        setTimeout(()=>{
          if(badge) badge.classList.add('leveling');
          if(lvNum) lvNum.textContent=endLevel;
          if(fill){ fill.style.transition='none'; fill.style.width='0%'; }
          setTimeout(()=>{
            if(fill){ fill.style.transition='width 0.9s cubic-bezier(.2,.8,.3,1)'; fill.style.width=finalPct+'%'; }
            if(labelText) labelText.textContent=`${Math.round(endXp)} / ${xpToNextLevel(endLevel)} XP`;
          },60);
        },950);
      }
    });
  });

  document.getElementById('xpContinueBtn').onclick=()=>{ closeModal(); onDone(); };
}
function showFinalResultModal(){
  if(!matchState.matchOver){ matchState.matchOver=true; }
  if(!matchState.finalApplied){
    applyMatchResultToProfile();
    matchState.finalApplied=true;
    queueSave();
    const order0=[0,1,2,3].slice().sort((a,b)=>matchState.scores[b]-matchState.scores[a]);
    sfxPlay(order0.indexOf(0)===0 ? 'win' : 'lose');
  }
  const order=[0,1,2,3].slice().sort((a,b)=>matchState.scores[b]-matchState.scores[a]);
  const medals=['🥇','🥈','🥉','4위'];
  const rows=order.map((idx,rank)=>`
    <div class="rank-row"><span class="medal">${medals[rank]}</span>
    <span style="flex:1;">${G.players[idx].name}</span>
    <span class="val">${matchState.scores[idx]}점</span></div>`).join('');

  openModal(`<h2>최종 결과</h2>${rows}
    <p class="sub" style="text-align:center;margin-top:10px;">경험치는 라운드마다 정산되었습니다 · 현재 Lv.${profile.level}</p>
    <div class="modal-actions">
      <button class="btn ghost" id="finalLogBtn">📜 로그</button>
      <button class="btn" id="finalNewBtn">새 매치 시작</button>
    </div>`);
  document.getElementById('finalNewBtn').onclick=async ()=>{ await clearSavedGame(); showSetupModal(); };
  document.getElementById('finalLogBtn').onclick=()=>{ openLogModal(()=>showFinalResultModal()); };
}
const RULE_TEXT = `
    4인 고정 (나 + 영호·옥순·순자) · 각자 13장씩 시작합니다.<br><br>
    · 순서: 싱글(1) &lt; 페어(2) &lt; 트리플(3) &lt; 메이드(5). 4장은 낼 수 없습니다.<br>
    · 숫자 순위: 2 &gt; 1 &gt; 13 &gt; 12 &gt; … &gt; 3<br>
    · 같은 숫자는 해 &gt; 달 &gt; 별 &gt; 구름 순<br>
    · 메이드(5장): 스트레이트플러시 &gt; 포카드 &gt; 풀하우스 &gt; 플러시 &gt; 스트레이트<br>
    · 구름3을 가진 사람이 첫 선(先)이 됩니다.<br>
    · 모두 패스하면 마지막으로 낸 사람이 다시 선이 됩니다.<br>
    · 한 명이 타일을 다 내면 그 라운드는 즉시 종료, 남은 타일 수 차이만큼 정산합니다.<br>
    · 2 페널티: 라운드가 끝날 때 손에 숫자 2가 남아있으면, 2가 1장당 벌점이 2배씩 중첩됩니다
    (2장이면 4배, 3장이면 8배, 4장이면 16배). 예: 3장 중 2장이 숫자 2라면 3장×4배=12장으로 간주해 정산합니다.<br>
    · 라운드제: 정해진 판 수를 모두 마치면 총점이 가장 높은 사람이 우승입니다.<br>
    · 점수제: 시작 점수에서 매 라운드 정산하며, 누구든 0점 이하가 되면 매치가 종료됩니다.
`;
function showRulesModal(){
  openModal(`<h2>렉시오 · LEXIO 규칙</h2>
    <p class="sub">${RULE_TEXT}</p>
    <div class="modal-actions"><button class="btn" id="closeRuleBtn">닫기</button></div>`);
  document.getElementById('closeRuleBtn').onclick=closeModal;
}

const ROUND_PRESETS=[3,5,7,10];
let setupEndMode='rounds';
let setupTotalRounds=TOTAL_ROUNDS;
function showSetupModal(){
  setupEndMode='rounds';
  setupTotalRounds=TOTAL_ROUNDS;
  renderSetupModal();
}
function renderSetupModal(){
  openModal(`<h2>렉시오 · LEXIO</h2>
    <p class="sub" style="text-align:center;">4인 고정 (나 + 영호·옥순·순자) · 각자 13장씩 시작합니다.</p>
    <p class="sub">진행 방식</p>
    <div class="row" id="endModeRow">
      <div class="suit-opt${setupEndMode==='rounds'?' sel':''}" data-mode="rounds">📅 라운드제</div>
      <div class="suit-opt${setupEndMode==='bust'?' sel':''}" data-mode="bust">💯 점수제</div>
    </div>
    <div id="roundCountSection" style="display:${setupEndMode==='rounds'?'':'none'};">
      <p class="sub">총 라운드 수</p>
      <div class="row" id="roundPresetRow">
        ${ROUND_PRESETS.map(n=>`<div class="suit-opt${n===setupTotalRounds?' sel':''}" data-n="${n}">${n}판</div>`).join('')}
      </div>
    </div>
    <div id="startScoreSection" style="display:${setupEndMode==='bust'?'':'none'};">
      <p class="sub">시작 점수 (보통 50점)</p>
      <div class="row"><input type="number" id="startScoreInput" value="50" min="10" max="999"
        style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0000002a;color:var(--ivory);font-size:14px;"></div>
      <p class="sub">누구든 점수가 0점 이하가 되면 그 라운드를 끝으로 매치가 종료됩니다.</p>
    </div>
    <div class="modal-actions"><button class="btn" id="setupStartBtn">게임 시작</button></div>`);

  document.querySelectorAll('#endModeRow .suit-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ setupEndMode=el.dataset.mode; renderSetupModal(); });
  });
  document.querySelectorAll('#roundPresetRow .suit-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ setupTotalRounds=parseInt(el.dataset.n,10); renderSetupModal(); });
  });
  document.getElementById('setupStartBtn').onclick=()=>{
    if(setupEndMode==='bust'){
      const v=parseInt(document.getElementById('startScoreInput').value,10);
      const startScore=isNaN(v)?50:Math.max(10,Math.min(999,v));
      startMatch({endMode:'bust', startScore});
    } else {
      startMatch({endMode:'rounds', totalRounds:setupTotalRounds});
    }
  };
}

/* ============================ 저장/불러오기 ============================ */
let saveTimer=null;
function queueSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(saveGameState, 300); }
async function saveGameState(){
  if(!G) return;
  try{ localStorage.setItem('lexio_save', JSON.stringify({G, matchState})); }catch(e){}
}
function flushSaveNow(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; } saveGameState(); }
async function clearSavedGame(){ try{ localStorage.removeItem('lexio_save'); }catch(e){} }

document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSaveNow(); });
window.addEventListener('pagehide', flushSaveNow);
window.addEventListener('beforeunload', flushSaveNow);
window.addEventListener('blur', flushSaveNow);

/* ============================ 초기화 ============================ */
(async function init(){
  loadSfxPref();
  await loadProfile();
  try{
    const raw=localStorage.getItem('lexio_save');
    if(raw){
      const data=JSON.parse(raw);
      if(data && data.G && data.matchState){
        matchState=data.matchState;
        G=data.G;
        if(!matchState.endMode) matchState.endMode='rounds';
        // JSON은 Infinity를 저장할 수 없어 null로 바뀌므로 점수제 매치는 불러올 때 다시 채워준다
        if(matchState.endMode==='bust') matchState.totalRounds=Infinity;
        else if(matchState.totalRounds===null || matchState.totalRounds===undefined) matchState.totalRounds=TOTAL_ROUNDS;
        render();
        if(G.finished){
          // 마지막으로 종료된 시점(라운드 결과 / 최종 결과)을 그대로 다시 보여준다
          if(matchState.matchOver){ showFinalResultModal(); }
          else{
            const last=matchState.history[matchState.history.length-1];
            if(last) showRoundResultModal(last.roundScores, last.counts, last.winnerIdx, last.transfers, last.isLastRound);
          }
        } else {
          scheduleTurnIfAI();
        }
        return;
      }
    }
  }catch(e){}
  showSetupModal();
})();

})();
</script>
